syntax = "proto3";

package mutex;
option go_package = "github.com/oliver327e/chit-chat/grpc;chatpb";

service MutualExclusion {
  rpc RequestAccess (AccessRequest) returns (AccessReply);
}

message AccessRequest {
  int32 node_id = 1;
  uint64 timestamp = 2;
}

message AccessReply {
  uint64 timestamp = 1;
}
