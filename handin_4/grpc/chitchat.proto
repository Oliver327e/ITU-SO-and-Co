
syntax = "proto3";

package chitchat;

option go_package = "github.com/oliver327e/chit-chat/grpc;chatpb";


service ChatService {

    // A client joins and receives broadcasts
    rpc Join(JoinRequest) returns (stream Broadcast);

    // A client publishes a chat message
    rpc Publish(PublishRequest) returns (PublishResponse);

    // A client leaves the chat
    rpc Leave(LeaveRequest) returns (LeaveResponse);
}


message JoinRequest {
    string participant_id = 1;
    uint64 logical_time = 2;
}


message PublishRequest {
    string participant_id = 1;
    string text = 2;
    uint64 logical_time = 3;
}

message PublishResponse {
    bool accepted = 1;
    uint64 logical_time = 2;
}

message LeaveRequest {
    string participant_id = 1;
    uint64 logical_time = 2;
}

message LeaveResponse {
    bool success = 1;
    uint64 logical_time = 2;
}

enum BroadcastType {
    BROADCAST_TYPE_UNSPECIFIED = 0;
    BROADCAST_TYPE_CHAT = 1;
    BROADCAST_TYPE_JOIN = 2;
    BROADCAST_TYPE_LEAVE = 3;
}

message Broadcast {
    string content = 1;
    uint64 logical_time = 2;
    string participant_id = 3;
    BroadcastType event_type = 4;
}
